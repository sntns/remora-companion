[workspace]
resolver = "2"
members = [
    "components/remora-etcher-format",
    "components/remora-etcher-disk",
    "components/remora-etcher-disk-application",
    "components/remora-etcher-disk-adapter-native",
    "components/remora-etcher-disk-application-transport-cli",
    "components/remora-etcher-flash",
    "components/remora-etcher-flash-application",
    "components/remora-etcher-flash-adapter-bmap",
    "components/remora-etcher-flash-application-transport-cli",
    "components/remora-etcher-image",
    "components/remora-etcher-image-application",
    "components/remora-etcher-image-adapter-partition-table",
    "components/remora-etcher-image-adapter-ext4",
    "components/remora-etcher-image-adapter-vfat",
    "components/remora-etcher-image-application-transport-cli",
    "components/remora-etcher-fs-walk",
    "components/remora-etcher-squashfs",
    "components/remora-etcher-squashfs-application",
    "components/remora-etcher-squashfs-adapter-backhand",
    "components/remora-etcher-squashfs-application-transport-cli",
    "components/remora-etcher-scratch",
    "components/remora-etcher-identity",
    "components/remora-etcher-identity-application",
    "components/remora-etcher-identity-adapter-keygen",
    "components/remora-etcher-identity-application-transport-cli",
    "components/remora-etcher-config",
    "components/remora-etcher-config-application",
    "components/remora-etcher-config-application-transport-cli",
    "components/remora-etcher-convert",
    "components/remora-etcher-convert-application",
    "components/remora-etcher-convert-adapter-gzip",
    "components/remora-etcher-convert-adapter-qcow2",
    "components/remora-etcher-convert-application-transport-cli",
    "components/remora-etcher-progress",
    "components/remora-etcher-batch",
    "components/remora-etcher-batch-application",
    "components/remora-etcher-batch-application-transport-cli",
    "components/remora-etcher-factory",
    "components/remora-etcher-factory-adapter-gateway",
    "components/remora-etcher-factory-application",
    "components/remora-etcher-factory-application-transport-cli",
    "containers/remora-etcher",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"
publish = false

# Drives `cargo release` (see .github/workflows/cut-release.yml): every
# crate inherits `version.workspace = true`, so bumping this one field
# bumps the whole workspace in a single commit (cargo-release's own
# `consolidate-commits`, on by default for workspaces). `publish = false`
# mirrors the Cargo.toml field above -- this never touches crates.io.
[workspace.metadata.release]
publish = false
push = true
allow-branch = ["main"]
pre-release-commit-message = "chore: release v{{version}}"
tag-name = "v{{version}}"
tag-message = "v{{version}}"

# Control binary size, matching remora-disk's profile.
[profile.release]
lto = true

# Shared across every components/*-application and containers/* crate, so the
# DI convention (port + newtype wrapper, manual composition root) and error
# convention (thiserror leaf + error-stack context at boundaries) stay
# identical everywhere, matching remora-edge.
[workspace.dependencies]
busybody = "1.0.16"
error-stack = "0.8"
thiserror = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
clap = { version = "4.5", features = ["derive", "cargo", "env"] }

# Async port traits (see remora-etcher-progress and the async-trait
# convention in CLAUDE.md) -- matches remora-edge's own choice, needed
# because every *ServiceInterface is used as a `Box<dyn ...>` through
# busybody, so native async-fn-in-trait (not dyn-safe) doesn't apply.
async-trait = "0.1"
tokio-stream = "0.1"
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# remora-etcher-factory-adapter-gateway: the one adapter in this workspace
# that's a real network call (a factory-device credential request against
# sntns-platform's gateway) rather than blocking local file I/O -- see its
# own doc comment for why it's async-native instead of sync-wrapped like
# every other adapter here.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22"
# Local keypair + PKCS#10 CSR generation for factory provisioning -- the
# platform never sees the private key, only the CSR built from it.
rcgen = "0.14"
# PKCS#8 -> SEC1 private-key conversion for remora-factory.yaml: rcgen's own
# DER output is PKCS#8, but the known-good files this renders to match use
# SEC1 (`BEGIN EC PRIVATE KEY`). Key *generation* deliberately stays with
# rcgen -- p256's own RNG-based generation hits a rand_core version conflict
# with elliptic-curve 0.14's trait bounds; this crate is only used for the
# PKCS8->SEC1 format conversion of a key rcgen already generated.
p256 = { version = "0.14", features = ["pkcs8", "std"] }
pem = "4.0"

# am-fs-ext4 (github.com/christhomas/rust-fs-ext4) fails to build at all on
# aarch64 in every published version (0.3.2/0.3.3/0.4.0): capi.rs hardcodes
# an i8 array against a c_char field, which is unsigned there. One-line fix
# upstream: https://github.com/christhomas/rust-fs-ext4/pull/36. Until that
# merges and releases, use our fork's branch (also drops a sibling-checkout
# path dep that only resolves in the upstream repo's own dev environment).
[patch.crates-io]
am-fs-ext4 = { git = "https://github.com/sntns/rust-fs-ext4", branch = "remora-etcher" }
