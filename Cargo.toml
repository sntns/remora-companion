[workspace.package]
version = "0.17.0"
edition = "2021"
license = "Apache-2.0"
publish = false
# dist derives every download URL (installers, Homebrew formulas, `rmra
# update`) from this field.
repository = "https://github.com/sntns/remora-companion"
homepage = "https://github.com/sntns/remora-companion"

# Drives `cargo release` (see .github/workflows/cut-release.yml): every
# crate inherits `version.workspace = true`, so bumping this one field
# bumps the whole workspace in a single commit (cargo-release's own
# `consolidate-commits`, on by default for workspaces). `publish = false`
# mirrors the Cargo.toml field above -- this never touches crates.io.
[workspace.metadata.release]
publish = false
push = true
allow-branch = ["main"]
pre-release-commit-message = "chore: release v{{version}}"
tag-name = "v{{version}}"
tag-message = "v{{version}}"

# Control binary size, matching remora-disk's profile.
[profile.release]
lto = true

# What dist builds releases with (dist-workspace.toml).
[profile.dist]
inherits = "release"
lto = "thin"

# Shared across every components/*-application and containers/* crate, so the
# DI convention (port + newtype wrapper, manual composition root) and error
# convention (thiserror leaf + error-stack context at boundaries) stay
# identical everywhere, matching remora-edge.
[workspace.dependencies]
busybody = "1.0.16"
error-stack = "0.8"
thiserror = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
clap = { version = "4.5", features = ["derive", "cargo", "env"] }

# Async port traits (see remora-progress and the async-trait
# convention in CLAUDE.md) -- matches remora-edge's own choice, needed
# because every *ServiceInterface is used as a `Box<dyn ...>` through
# busybody, so native async-fn-in-trait (not dyn-safe) doesn't apply.
async-trait = "0.1"
tokio-stream = "0.1"
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The provisioning station: its HTTP server (axum, already under tonic),
# station.yaml (the same YAML crate as remora-edge's configuration), and
# its durations and journal timestamps.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
yaml_serde = "0.10"
humantime = "2"

# HTTP client of remora-update-adapter-github (release feed, installers).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22"
# Local keypair + PKCS#10 CSR generation for factory provisioning -- the
# platform never sees the private key, only the CSR built from it.
rcgen = "0.14"
# PKCS#8 -> SEC1 private-key conversion for remora-factory.yaml: rcgen's own
# DER output is PKCS#8, but the known-good files this renders to match use
# SEC1 (`BEGIN EC PRIVATE KEY`). Key *generation* deliberately stays with
# rcgen -- p256's own RNG-based generation hits a rand_core version conflict
# with elliptic-curve 0.14's trait bounds; this crate is only used for the
# PKCS8->SEC1 format conversion of a key rcgen already generated.
p256 = { version = "0.14", features = ["pkcs8", "std"] }
pem = "4.0"
# Checking a CSR a device made itself (the provisioning station's claims):
# PKCS#10 parsing, and the SHA-256 of its public key that names the claim.
# The same der/spki generation as p256 0.14, so the key parses straight
# from the request's SubjectPublicKeyInfo.
x509-cert = { version = "0.3", default-features = false, features = ["std"] }
sha2 = "0.11"

# rmra's gRPC client to sntns-platform's public gateways (remora channel,
# iam). The .proto files are vendored under components/platform-grpc/proto
# and compiled with protox, a pure-Rust protobuf compiler, so no protoc is
# needed on any CI runner (Windows/macOS included).
tonic = { version = "0.14", default-features = false, features = ["codegen", "transport", "tls-ring", "tls-native-roots", "tls-webpki-roots"] }
tonic-prost = "0.14"
prost-types = "0.14"
prost = "0.14"
tonic-prost-build = "0.14"
protox = "0.9"
# rmra's terminal output: clack-style prompts/spinners/log lines (all on
# stderr, which keeps stdout clean for `channel open`'s tunnel) and tables.
cliclack = "0.5"
# rmra's dynamic shell completion (contexts, devices, releases...):
# `COMPLETE=$SHELL rmra`, see remora-completion.
clap_complete = { version = "4.6", features = ["unstable-dynamic"] }
console = "0.16"
comfy-table = "7"
# rmra ssh: a throwaway ed25519 key, certified by the platform per session.
ssh-key = { version = "0.6", default-features = false, features = ["ed25519", "std", "rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
tempfile = "3"
# The throwaway ssh key's PEM, wiped from memory once a session is over.
zeroize = "1"

# am-fs-ext4 (github.com/christhomas/rust-fs-ext4) fails to build at all on
# aarch64 in every published version (0.3.2/0.3.3/0.4.0): capi.rs hardcodes
# an i8 array against a c_char field, which is unsigned there. One-line fix
# upstream: https://github.com/christhomas/rust-fs-ext4/pull/36. Until that
# merges and releases, use our fork's branch (also drops a sibling-checkout
# path dep that only resolves in the upstream repo's own dev environment).
[patch.crates-io]
am-fs-ext4 = { git = "https://github.com/sntns/rust-fs-ext4", branch = "remora-etcher" }
