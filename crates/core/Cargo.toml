[package]
name = "remora-etcher-core"
description = "Core library for remora-etcher: squashfs building, disk-image partition manipulation, and bmap-aware flashing"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
am-fs-ext4 = "0.4"
backhand = "0.25"
bmap-parser = "0.2"
# Published 0.3.6 has a real bug: Dir::create_dir's "."/".." entries go
# through the generic write_entry() path, which writes bogus LFN entries in
# front of them — dosfsck flags every directory we create as corrupted (see
# the remora-etcher plan's Phase 5 vfat spike). Already fixed upstream on
# master (unreleased 0.4.0: write_entry special-cases "."/".." to skip LFN
# generation) — depend on that commit directly until 0.4.0 is released.
fatfs = { git = "https://github.com/rafalh/rust-fatfs", rev = "c4b88477b22ca7e5131fbd8891f62a5deaa88e6e" }
gptman = "3"
mbrman = "0.5"
rand = "0.8"
ssh-key = { version = "0.6", features = ["ed25519", "rand_core", "getrandom"] }
walkdir = "2.5"
tracing = "0.1"
