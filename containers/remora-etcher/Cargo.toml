[package]
name = "remora-etcher"
description = "Standalone provisioning and flashing tool for Remora devices"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "remora-etcher"
path = "src/main.rs"

[dependencies]
remora-disk = { path = "../../components/disk" }
remora-disk-application = { path = "../../components/disk-application" }
remora-disk-adapter-native = { path = "../../components/disk-adapter-native" }
remora-disk-application-transport-cli = { path = "../../components/disk-application-transport-cli" }
remora-flash = { path = "../../components/flash" }
remora-flash-application = { path = "../../components/flash-application" }
remora-flash-adapter-bmap = { path = "../../components/flash-adapter-bmap" }
remora-flash-application-transport-cli = { path = "../../components/flash-application-transport-cli" }
remora-image = { path = "../../components/image" }
remora-image-application = { path = "../../components/image-application" }
remora-image-adapter-partition-table = { path = "../../components/image-adapter-partition-table" }
remora-image-adapter-ext4 = { path = "../../components/image-adapter-ext4" }
remora-image-adapter-vfat = { path = "../../components/image-adapter-vfat" }
remora-image-application-transport-cli = { path = "../../components/image-application-transport-cli" }
remora-fs-walk = { path = "../../components/fs-walk" }
remora-squashfs = { path = "../../components/squashfs" }
remora-squashfs-application = { path = "../../components/squashfs-application" }
remora-squashfs-adapter-backhand = { path = "../../components/squashfs-adapter-backhand" }
remora-squashfs-application-transport-cli = { path = "../../components/squashfs-application-transport-cli" }
remora-scratch = { path = "../../components/scratch" }
remora-identity = { path = "../../components/identity" }
remora-identity-application = { path = "../../components/identity-application" }
remora-identity-adapter-keygen = { path = "../../components/identity-adapter-keygen" }
remora-identity-application-transport-cli = { path = "../../components/identity-application-transport-cli" }
remora-config = { path = "../../components/config" }
remora-config-application = { path = "../../components/config-application" }
remora-config-application-transport-cli = { path = "../../components/config-application-transport-cli" }
remora-convert = { path = "../../components/convert" }
remora-convert-application = { path = "../../components/convert-application" }
remora-convert-adapter-gzip = { path = "../../components/convert-adapter-gzip" }
remora-convert-adapter-qcow2 = { path = "../../components/convert-adapter-qcow2" }
remora-convert-application-transport-cli = { path = "../../components/convert-application-transport-cli" }
remora-batch = { path = "../../components/batch" }
remora-batch-application = { path = "../../components/batch-application" }
remora-batch-application-transport-cli = { path = "../../components/batch-application-transport-cli" }
remora-factory = { path = "../../components/factory" }
remora-factory-adapter-grpc = { path = "../../components/factory-adapter-grpc" }
remora-factory-adapter-local = { path = "../../components/factory-adapter-local" }
remora-context = { path = "../../components/context" }
remora-context-application = { path = "../../components/context-application" }
remora-context-adapter-file = { path = "../../components/context-adapter-file" }
remora-context-adapter-grpc = { path = "../../components/context-adapter-grpc" }
remora-context-application-transport-cli = { path = "../../components/context-application-transport-cli" }
remora-factory-application = { path = "../../components/factory-application" }
remora-factory-application-transport-cli = { path = "../../components/factory-application-transport-cli" }
remora-station = { path = "../../components/station" }
remora-station-application = { path = "../../components/station-application" }
remora-station-adapter-jsonl = { path = "../../components/station-adapter-jsonl" }
remora-station-adapter-hooks-process = { path = "../../components/station-adapter-hooks-process" }
remora-station-adapter-operator-tui = { path = "../../components/station-adapter-operator-tui" }
remora-station-application-transport-cli = { path = "../../components/station-application-transport-cli" }
remora-update = { path = "../../components/update" }
remora-update-application = { path = "../../components/update-application" }
remora-update-adapter-github = { path = "../../components/update-adapter-github" }
remora-update-application-transport-cli = { path = "../../components/update-application-transport-cli" }
remora-tui = { path = "../../components/tui" }
remora-format = { path = "../../components/format" }
remora-completion = { path = "../../components/completion" }
clap_complete.workspace = true
error-stack.workspace = true
busybody.workspace = true
tokio.workspace = true
clap.workspace = true
tracing = "0.1"

[dev-dependencies]
# `station serve` and `station simulate` end to end, as shipped, against
# the in-process fake gateway; the resulting remora-factory.yaml is read
# the way remora-edge reads it.
remora-ota-adapter-grpc = { path = "../../components/ota-adapter-grpc", features = ["test-gateway"] }
tokio = { workspace = true, features = ["net", "process", "io-util", "macros"] }
tempfile.workspace = true
serde.workspace = true
serde_json.workspace = true
yaml_serde.workspace = true
p256.workspace = true
pem.workspace = true

[dependencies.tracing-subscriber]
version = "0.3"
features = ["env-filter"]

# Shipped by dist (dist-workspace.toml), although the workspace is
# publish = false (that only means "not on crates.io").
[package.metadata.dist]
dist = true

[package.metadata.deb]
maintainer = "Lionel Molinier <lionel.molinier@sentiens.fr>"
copyright = "2026, Sentiens SAS <copyright@sentiens.fr>"
license-file = ["../../LICENSE", "4"]
extended-description = """\
Remora Etcher is a standalone provisioning and flashing tool for Remora \
devices. It builds squashfs images, injects files into disk-image \
partitions, and flashes images to removable media, bmaptool-style."""
depends = "$auto"
section = "utility"
priority = "optional"
assets = [
    ["target/release/remora-etcher", "usr/bin/", "755"],
    ["../../README.md", "usr/share/doc/remora-etcher/README", "644"],
]
