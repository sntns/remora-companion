[workspace]
members = ["cargo:."]

# Release packaging with dist (https://opensource.axo.dev/cargo-dist/):
# `dist generate` writes .github/workflows/release.yml from this; edit here,
# never that file. Pushing a vX.Y.Z tag (see cut-release.yml) builds every
# target, then publishes it as a GitHub release of this repository.
[dist]
cargo-dist-version = "0.32.0"
ci = "github"
installers = ["shell", "powershell", "homebrew"]
# Linux builds are musl, statically linked: one binary for any distro,
# whatever its glibc.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-pc-windows-msvc",
]
# Homebrew formulas (`brew install sntns/tap/rmra`), pushed on each release.
# Needs a HOMEBREW_TAP_TOKEN secret with contents:write on it.
tap = "sntns/homebrew-tap"
publish-jobs = ["homebrew"]
# Where the shell/powershell installers put the binaries: flat, no ~/.cargo.
install-path = "~/.local/bin"
# Build a plan on PRs (cheap), everything on tags.
pr-run-mode = "plan"
# Build provenance attestations: GitHub only offers them to public repos on
# this organization's plan.
github-attestations = true
