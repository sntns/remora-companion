[package]
name = "remora-flash-application"
description = "Use-case implementation for the flash vertical"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
remora-progress = { path = "../progress" }
async-trait.workspace = true
tokio.workspace = true
remora-disk = { path = "../disk" }
remora-flash = { path = "../flash" }
error-stack.workspace = true
remora-format = { path = "../format" }
tokio-util.workspace = true
remora-context = { path = "../context" }
tracing = "0.1"

[dev-dependencies]
# Real (not mocked) adapter, for an integration-style test of the use case
# end to end — same posture as the other application crates' tests.
remora-flash-adapter-bmap = { path = "../flash-adapter-bmap" }
remora-flash-adapter-file = { path = "../flash-adapter-file" }
tokio-stream.workspace = true
# Building .bmaptar and compressed fixtures, the way meta-remora does.
tar = "0.4"
bzip2 = "0.6"
