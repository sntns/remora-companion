[package]
name = "remora-channel-application-transport-cli"
description = "clap subcommands for the channel application service: channel open (an ssh ProxyCommand on stdio), ssh and scp (through the channel or local), local certificates and console login codes"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
remora-channel = { path = "../channel" }
remora-context = { path = "../context" }
remora-tui = { path = "../tui" }
remora-completion = { path = "../completion" }
clap.workspace = true
error-stack.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util", "signal"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "time"] }
