[package]
name = "remora-platform-http"
description = "Shared client plumbing for sntns-platform's public gateways over their REST API and WebSockets: the wire model, TLS, credentials and statuses -- used by adapter crates only"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
remora-context = { path = "../context" }
reqwest = { workspace = true, features = ["stream"] }
tokio-tungstenite.workspace = true
rustls.workspace = true
rustls-native-certs.workspace = true
webpki-roots.workspace = true
url.workspace = true
tokio = { workspace = true, features = ["net"] }
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
humantime.workspace = true
thiserror.workspace = true
error-stack.workspace = true
axum = { workspace = true, optional = true, features = ["ws"] }
futures-util = { workspace = true, optional = true, features = ["sink", "std"] }
sha2 = { workspace = true, optional = true }

[features]
# An in-process fake platform gateway (iam, releases and resumable uploads,
# devices, factory devices, deployments that progress as they're polled)
# and the pieces for a test's own small fake (error answers, a channel's
# WebSocket) -- for the adapters' tests and their dependents', enabled
# from [dev-dependencies] only.
test-gateway = ["dep:axum", "dep:futures-util", "dep:sha2"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "signal"] }

[[example]]
name = "fake-gateway"
required-features = ["test-gateway"]
