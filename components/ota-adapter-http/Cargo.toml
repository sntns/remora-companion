[package]
name = "remora-ota-adapter-http"
description = "OtaGatewayAdapter over sntns-platform's remora gateway REST API: releases (with the multipart, resumable artifact upload and the ranged download) and deployments"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
remora-ota = { path = "../ota" }
remora-context = { path = "../context" }
remora-platform-http = { path = "../platform-http" }
async-trait.workspace = true
error-stack.workspace = true
futures-util = { workspace = true, features = ["std"] }
serde_json.workspace = true
tokio.workspace = true
rand_core.workspace = true

[dev-dependencies]
sha2.workspace = true
remora-platform-http = { path = "../platform-http", features = ["test-gateway"] }
tokio = { workspace = true, features = ["macros", "rt"] }
