[package]
name = "remora-squashfs"
description = "Domain crate for the squashfs vertical: BuildOptions model, the SquashfsAdapter port, and the squashfs application port"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Only the walk entry model: the walkdir-backed implementation stays out.
remora-fs-walk = { path = "../fs-walk", default-features = false }
remora-progress = { path = "../progress" }
async-trait.workspace = true
busybody.workspace = true
error-stack.workspace = true
thiserror.workspace = true
serde.workspace = true
# Error::Backhand wraps this crate's own error type directly rather than
# reimplementing it as a pure domain type — same rationale as
# remora-flash's BlockMap / remora-image's ext4/fatfs errors. Only the
# type: the codecs are the adapter's.
backhand = { version = "0.25", default-features = false }
