[package]
name = "remora-station-adapter-hooks-process"
description = "HookRunnerAdapter implementation: a station's <event>.d/ scripts run run-parts style, as child processes"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
remora-station = { path = "../station" }
remora-factory = { path = "../factory" }
async-trait.workspace = true
error-stack.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "fs"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
