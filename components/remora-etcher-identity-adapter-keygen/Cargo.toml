[package]
name = "remora-etcher-identity-adapter-keygen"
description = "Concrete KeygenAdapter: wraps rand + ssh-key"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
remora-etcher-identity = { path = "../remora-etcher-identity" }
