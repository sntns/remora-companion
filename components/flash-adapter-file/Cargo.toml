[package]
name = "remora-flash-adapter-file"
description = "Concrete ImageSourceAdapter: reads an image file, raw or compressed (bzip2, gzip, zstd), or the one a .bmaptar bundle carries"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
remora-flash = { path = "../flash" }
error-stack.workspace = true
bmap-parser = "0.2"
remora-unpack = { path = "../unpack" }

[dev-dependencies]
tar = "0.4"
bzip2 = "0.6"
flate2 = "1"
zstd = { version = "0.13", default-features = false }
tokio-util.workspace = true
