syntax = "proto3";

package sntns.service.remora.v1;

import "google/protobuf/timestamp.proto";
import "sntns/service/v1/model.proto";

// Deployments: asking one device to install a release.
service DeploymentService {
    // Creates a draft deployment. Refused if the target device already has a
    // non-terminal deployment.
    rpc CreateDeployment(DeploymentServiceCreateDeploymentRequest) returns (DeploymentServiceCreateDeploymentResponse);
    rpc GetDeployment(DeploymentServiceGetDeploymentRequest) returns (DeploymentServiceGetDeploymentResponse);
    rpc ListDeployments(DeploymentServiceListDeploymentsRequest) returns (DeploymentServiceListDeploymentsResponse);
    // Starts a draft deployment, making it visible to the target device.
    rpc StartDeployment(DeploymentServiceStartDeploymentRequest) returns (DeploymentServiceStartDeploymentResponse);
    // Requests cancellation of a deployment still pending or running.
    rpc CancelDeployment(DeploymentServiceCancelDeploymentRequest) returns (DeploymentServiceCancelDeploymentResponse);
    rpc DeleteDeployment(DeploymentServiceDeleteDeploymentRequest) returns (DeploymentServiceDeleteDeploymentResponse);
    rpc ListDeploymentLogEntries(DeploymentServiceListDeploymentLogEntriesRequest) returns (DeploymentServiceListDeploymentLogEntriesResponse);
}

message DeploymentDescriptor {
    .sntns.service.v1.ResourceReference resource = 1;
    map<string, string> labels = 2;
    .sntns.service.v1.ResourceReference release_reference = 3;
    .sntns.service.v1.ResourceReference target_reference = 4;
    // PENDING, RUNNING, CANCELING, SUCCEEDED, FAILED, CANCELED or REJECTED.
    string status_value = 5;
    map<string, string> status_details = 6;
    google.protobuf.Timestamp status_timestamp = 7;
}

message DeploymentSummary {
    .sntns.service.v1.ResourceReference resource = 1;
    string status_value = 2;
}

message DeploymentLogEntryProgress {
    int64 current = 1;
    int64 max = 2;
    // e.g. "%" or "bytes".
    string unit = 3;
    double speed = 4;
}

message DeploymentLogEntry {
    string execution = 1;
    string result = 2;
    int32 code = 3;
    repeated string details = 4;
    google.protobuf.Timestamp recorded_at = 5;
    DeploymentLogEntryProgress progress = 6;
}

message DeploymentServiceCreateDeploymentRequest {
    string deployment_name = 1;
    string deployment_release_name = 2;
    string deployment_target_name = 3;
    map<string, string> deployment_labels = 4;
}

message DeploymentServiceCreateDeploymentResponse {
    .sntns.service.v1.ResourceReference deployment_reference = 1;
}

message DeploymentServiceGetDeploymentRequest {
    string deployment_name = 1;
}

message DeploymentServiceGetDeploymentResponse {
    DeploymentDescriptor deployment_descriptor = 1;
}

message DeploymentServiceListDeploymentsRequest {
    string deployment_target_name = 1;
    string deployment_release_name = 2;
    map<string, string> deployment_labels = 3;
}

message DeploymentServiceListDeploymentsResponse {
    repeated DeploymentSummary deployment_summaries = 1;
}

message DeploymentServiceStartDeploymentRequest {
    string deployment_name = 1;
}

message DeploymentServiceStartDeploymentResponse {
    .sntns.service.v1.ResourceReference deployment_reference = 1;
}

message DeploymentServiceCancelDeploymentRequest {
    string deployment_name = 1;
}

message DeploymentServiceCancelDeploymentResponse {
    .sntns.service.v1.ResourceReference deployment_reference = 1;
}

message DeploymentServiceDeleteDeploymentRequest {
    string deployment_name = 1;
}

message DeploymentServiceDeleteDeploymentResponse {
    .sntns.service.v1.ResourceReference deployment_reference = 1;
}

message DeploymentServiceListDeploymentLogEntriesRequest {
    string deployment_name = 1;
}

message DeploymentServiceListDeploymentLogEntriesResponse {
    repeated DeploymentLogEntry deployment_log_entries = 1;
}
