syntax = "proto3";

package sntns.service.remora.v1;

import "google/protobuf/wrappers.proto";
import "sntns/service/v1/model.proto";

// Releases: a version and the artifacts (e.g. RAUC bundles) devices install.
service ReleaseService {
    // Creates a new, empty release; artifacts are uploaded afterward.
    rpc CreateRelease(ReleaseServiceCreateReleaseRequest) returns (ReleaseServiceCreateReleaseResponse);
    rpc GetRelease(ReleaseServiceGetReleaseRequest) returns (ReleaseServiceGetReleaseResponse);
    rpc UpdateRelease(ReleaseServiceUpdateReleaseRequest) returns (ReleaseServiceUpdateReleaseResponse);
    rpc ListReleases(ReleaseServiceListReleasesRequest) returns (ReleaseServiceListReleasesResponse);
    rpc DeleteRelease(ReleaseServiceDeleteReleaseRequest) returns (ReleaseServiceDeleteReleaseResponse);
    // Client-streaming: uploads bytes directly into a release-owned object.
    rpc UploadReleaseArtifact(stream ReleaseServiceUploadReleaseArtifactRequest) returns (ReleaseServiceUploadReleaseArtifactResponse);
    // How many bytes are already persisted for a resume token, so a resumed
    // upload continues from there; the server appends from that offset.
    rpc GetReleaseArtifactUploadOffset(ReleaseServiceGetReleaseArtifactUploadOffsetRequest) returns (ReleaseServiceGetReleaseArtifactUploadOffsetResponse);
    // Server-streaming: an artifact's bytes, whole or a range of them.
    rpc DownloadReleaseArtifact(ReleaseServiceDownloadReleaseArtifactRequest) returns (stream ReleaseServiceDownloadReleaseArtifactResponse);
}

message ReleaseArtifact {
    .sntns.service.v1.ResourceReference object_reference = 1;
    // The file name reported to update clients.
    string file_name = 2;
    string content_type = 3;
    int64 content_length = 4;
    string checksum_sha256 = 5;
    // Boolean expression over device tags matching this artifact against a
    // deployment target, e.g. `type:rauc && (board:hdc || board:rp5)`.
    // Empty means no restriction.
    string tag_condition = 6;
}

message ReleaseDescriptor {
    .sntns.service.v1.ResourceReference resource = 1;
    map<string, string> labels = 2;
    string version = 3;
    repeated ReleaseArtifact artifacts = 4;
}

message ReleaseSummary {
    .sntns.service.v1.ResourceReference resource = 1;
    string version = 2;
}

message ReleaseServiceCreateReleaseRequest {
    string release_name = 1;
    string release_version = 2;
    map<string, string> release_labels = 4;
}

message ReleaseServiceCreateReleaseResponse {
    .sntns.service.v1.ResourceReference release_reference = 1;
}

message ReleaseServiceGetReleaseRequest {
    string release_name = 1;
}

message ReleaseServiceGetReleaseResponse {
    ReleaseDescriptor release_descriptor = 1;
}

message ReleaseServiceUpdateReleaseRequest {
    message Labels {
        map<string, string> set = 1;
        bool merge = 2;
        repeated string unset = 3;
    }
    string release_name = 1;
    Labels release_labels = 2;
}

message ReleaseServiceUpdateReleaseResponse {
    .sntns.service.v1.ResourceReference release_reference = 1;
}

message ReleaseServiceListReleasesRequest {
    map<string, string> release_labels = 1;
}

message ReleaseServiceListReleasesResponse {
    repeated ReleaseSummary release_summaries = 1;
}

message ReleaseServiceDeleteReleaseRequest {
    string release_name = 1;
}

message ReleaseServiceDeleteReleaseResponse {
    .sntns.service.v1.ResourceReference release_reference = 1;
}

message ReleaseServiceUploadReleaseArtifactInitialRequest {
    string release_name = 1;
    string artifact_file_name = 2;
    string artifact_content_type = 3;
    string artifact_tag_condition = 4;
    // Optional client-chosen resume token: the same value as an interrupted
    // attempt resumes it instead of starting over.
    string artifact_content_id = 5;
}

message ReleaseServiceUploadReleaseArtifactSubsequentRequest {
    bytes artifact_chunk = 1;
}

message ReleaseServiceUploadReleaseArtifactRequest {
    oneof request {
        ReleaseServiceUploadReleaseArtifactInitialRequest initial_request = 1;
        ReleaseServiceUploadReleaseArtifactSubsequentRequest subsequent_request = 2;
    }
}

message ReleaseServiceUploadReleaseArtifactResponse {
    .sntns.service.v1.ResourceReference release_reference = 1;
}

message ReleaseServiceGetReleaseArtifactUploadOffsetRequest {
    string artifact_content_id = 1;
}

message ReleaseServiceGetReleaseArtifactUploadOffsetResponse {
    int64 artifact_content_offset = 1;
}

message ReleaseServiceDownloadReleaseArtifactRequest {
    string release_name = 1;
    string artifact_file_name = 2;
    // Byte range of the artifact's content to stream back. Unset offset: from
    // the start; unset length: to the end. A range past the end fails with
    // OUT_OF_RANGE.
    google.protobuf.Int64Value artifact_content_offset = 3;
    google.protobuf.Int64Value artifact_content_length = 4;
}

message ReleaseServiceDownloadReleaseArtifactResponse {
    bytes artifact_chunk = 1;
}
