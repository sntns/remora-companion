[package]
name = "remora-fs-walk"
description = "Shared host-filesystem tree walker (port + walkdir-backed implementation), used by any vertical that builds an image from a directory tree"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
busybody.workspace = true
error-stack.workspace = true
thiserror.workspace = true
walkdir = { version = "2.5", optional = true }

[features]
# The real FsWalkAdapterImpl. Off for a domain crate that only names the
# port or the entry model (remora-squashfs).
default = ["walkdir"]
walkdir = ["dep:walkdir"]
