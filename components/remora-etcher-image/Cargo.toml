[package]
name = "remora-etcher-image"
description = "Domain crate for the image vertical: partition table model, the partition-table/ext4/vfat ports, and the image application port"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
remora-etcher-progress = { path = "../remora-etcher-progress" }
async-trait.workspace = true
busybody.workspace = true
error-stack.workspace = true
thiserror.workspace = true
# Error::Ext4/Error::Fat wrap these crates' own error types directly rather
# than reimplementing them as pure domain types — same rationale as
# remora-etcher-flash's BlockMap: these are inert data, not infrastructure
# access, and duplicating them would just be busywork with no isolation
# benefit (the actual DI seam is the *port trait*, not the value shape).
am-fs-ext4 = "0.4"
fatfs = { git = "https://github.com/rafalh/rust-fatfs", rev = "c4b88477b22ca7e5131fbd8891f62a5deaa88e6e" }
