[package]
name = "remora-device-adapter-http"
description = "DeviceGatewayAdapter over sntns-platform's remora gateway REST API (list devices, get a device)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
remora-device = { path = "../device" }
remora-context = { path = "../context" }
remora-platform-http = { path = "../platform-http" }
async-trait.workspace = true
error-stack.workspace = true

[dev-dependencies]
remora-platform-http = { path = "../platform-http", features = ["test-gateway"] }
tokio = { workspace = true, features = ["macros", "rt"] }
