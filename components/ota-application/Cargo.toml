[package]
name = "remora-ota-application"
description = "OTA use case: publish releases (resumable artifact uploads), deploy them to devices by name or label selector, follow deployments"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
remora-ota = { path = "../ota" }
remora-context = { path = "../context" }
remora-device = { path = "../device" }
remora-progress = { path = "../progress" }
async-trait.workspace = true
error-stack.workspace = true
tokio.workspace = true
futures-util = { workspace = true, features = ["std"] }
sha2.workspace = true

[dev-dependencies]
remora-ota-adapter-http = { path = "../ota-adapter-http" }
remora-platform-http = { path = "../platform-http", features = ["test-gateway"] }
remora-ota-adapter-file = { path = "../ota-adapter-file" }
remora-device-application = { path = "../device-application" }
remora-device-adapter-http = { path = "../device-adapter-http" }
remora-context-application = { path = "../context-application" }
remora-context-adapter-file = { path = "../context-adapter-file" }
tempfile.workspace = true
tokio-util.workspace = true
