[package]
name = "remora-block-io"
description = "Shared I/O on a file or a disk device in its place: its length (a device's metadata length is 0, and neither macOS nor Windows seek to its end), and whole-sector access where a raw disk takes nothing else (Windows, macOS's raw nodes)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_IO", "Win32_System_Ioctl"] }
