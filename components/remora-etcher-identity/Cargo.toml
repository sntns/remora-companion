[package]
name = "remora-etcher-identity"
description = "Domain crate for the identity vertical: the KeygenAdapter port and the identity application port"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
remora-etcher-squashfs = { path = "../remora-etcher-squashfs" }
busybody.workspace = true
error-stack.workspace = true
thiserror.workspace = true
# Error::GenerateSshHostKey wraps this crate's own error type directly —
# same rationale as remora-etcher-flash's BlockMap / remora-etcher-image's
# ext4/fatfs errors.
ssh-key = { version = "0.6", features = ["ed25519", "rand_core", "getrandom"] }
