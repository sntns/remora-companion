[package]
name = "remora-station-application-transport-http"
description = "The station's HTTP contract with devices (hello, claims, polling, acks): an axum router over the station application service"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
remora-station = { path = "../station" }
remora-station-protocol = { path = "../station-protocol" }
axum.workspace = true
tokio = { workspace = true, features = ["net"] }
serde.workspace = true
serde_json.workspace = true
error-stack.workspace = true
thiserror.workspace = true

[dev-dependencies]
# The whole station, as `serve` wires it, against the in-process fake
# gateway; only the operator console's display is a hand-written stub.
remora-station-application = { path = "../station-application" }
remora-factory = { path = "../factory" }
remora-station-adapter-jsonl = { path = "../station-adapter-jsonl" }
remora-station-adapter-hooks-process = { path = "../station-adapter-hooks-process" }
remora-factory-application = { path = "../factory-application" }
remora-factory-adapter-grpc = { path = "../factory-adapter-grpc" }
remora-factory-adapter-local = { path = "../factory-adapter-local" }
remora-context = { path = "../context" }
remora-context-application = { path = "../context-application" }
remora-context-adapter-file = { path = "../context-adapter-file" }
remora-context-adapter-grpc = { path = "../context-adapter-grpc" }
remora-ota-adapter-grpc = { path = "../ota-adapter-grpc", features = ["test-gateway"] }
# The devices' side, raw: tests send bodies no well-behaved client would.
reqwest.workspace = true
base64.workspace = true
async-trait.workspace = true
rcgen.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
