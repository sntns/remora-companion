[package]
name = "remora-factory-application"
description = "Use-case implementation for the factory vertical"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
remora-factory = { path = "../factory" }
remora-progress = { path = "../progress" }
remora-context = { path = "../context" }
error-stack.workspace = true
async-trait.workspace = true
rcgen.workspace = true
p256.workspace = true
pem.workspace = true

[dev-dependencies]
# Only to *verify* a real platform-issued certificate set in one
# integration test (chain, SAN, EKU, key match) -- production code never
# parses/verifies these certificates itself, the device does that later.
x509-parser = { version = "0.18", features = ["verify"] }
base64.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
remora-context-application = { path = "../context-application" }
remora-context-adapter-file = { path = "../context-adapter-file" }
tempfile.workspace = true
