[package]
name = "remora-factory-application"
description = "Use-case implementation for the factory vertical"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
remora-factory = { path = "../factory" }
remora-progress = { path = "../progress" }
remora-context = { path = "../context" }
error-stack.workspace = true
async-trait.workspace = true

[dev-dependencies]
# The real local adapters (keypair + CSR, remora-factory.yaml): the use case
# runs end to end, only the platform call is stubbed. Rendering details are
# tested in the adapter crate itself.
remora-factory-adapter-local = { path = "../factory-adapter-local" }
p256.workspace = true
pem.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
remora-context-application = { path = "../context-application" }
remora-context-adapter-file = { path = "../context-adapter-file" }
tempfile.workspace = true
