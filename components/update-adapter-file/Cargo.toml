[package]
name = "remora-update-adapter-file"
description = "CheckStateAdapter over a JSON file in the configuration directory: when each binary last looked for a newer release, and what it found"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
remora-update = { path = "../update" }
async-trait.workspace = true
error-stack.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["fs"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
