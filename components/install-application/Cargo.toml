[package]
name = "remora-install-application"
description = "Use-case implementation for the install vertical: upload (resumable), verify, install with remora-otactl, reboot and validate, over the channel vertical"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
remora-install = { path = "../install" }
remora-channel = { path = "../channel" }
remora-ota = { path = "../ota" }
remora-progress = { path = "../progress" }
remora-format = { path = "../format" }
async-trait.workspace = true
error-stack.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "time"] }
tokio-stream.workspace = true

[dev-dependencies]
remora-context = { path = "../context" }
tokio-util.workspace = true
tempfile.workspace = true
