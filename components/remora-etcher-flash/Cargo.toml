[package]
name = "remora-etcher-flash"
description = "Domain crate for the flash vertical: FlashRequest/FlashOutcome model, the .bmap port, and the flash application port"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
remora-etcher-disk = { path = "../remora-etcher-disk" }
busybody.workspace = true
error-stack.workspace = true
thiserror.workspace = true
# BlockMap wraps bmap_parser::Bmap directly rather than reinventing the .bmap
# format as a pure domain type: the value only ever exists behind the
# BmapAdapter::parse port (never constructed ad hoc), and the actual
# checksum-verified sparse-copy algorithm (bmap_parser::copy) is
# safety-critical enough that reimplementing it to avoid this dependency
# would trade a real correctness risk for architectural purity.
bmap-parser = "0.2"
