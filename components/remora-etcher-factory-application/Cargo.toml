[package]
name = "remora-etcher-factory-application"
description = "Use-case implementation for the factory vertical"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
remora-etcher-factory = { path = "../remora-etcher-factory" }
remora-etcher-progress = { path = "../remora-etcher-progress" }
error-stack.workspace = true
async-trait.workspace = true
rcgen.workspace = true
p256.workspace = true
pem.workspace = true

[dev-dependencies]
# Only to *verify* a real platform-issued certificate set in one
# integration test (chain, SAN, EKU, key match) -- production code never
# parses/verifies these certificates itself, the device does that later.
x509-parser = { version = "0.18", features = ["verify"] }
base64.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
