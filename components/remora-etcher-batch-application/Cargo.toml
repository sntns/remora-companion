[package]
name = "remora-etcher-batch-application"
description = "Use-case implementation for the batch vertical"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
remora-etcher-batch = { path = "../remora-etcher-batch" }
remora-etcher-convert = { path = "../remora-etcher-convert" }
remora-etcher-identity = { path = "../remora-etcher-identity" }
remora-etcher-config = { path = "../remora-etcher-config" }
remora-etcher-image = { path = "../remora-etcher-image" }
remora-etcher-squashfs = { path = "../remora-etcher-squashfs" }
remora-etcher-factory = { path = "../remora-etcher-factory" }
remora-etcher-progress = { path = "../remora-etcher-progress" }
error-stack.workspace = true
async-trait.workspace = true

[dev-dependencies]
# Real (not mocked) adapters, for an integration-style test of the use case
# end to end — same posture as the other application crates' tests.
remora-etcher-convert-adapter-gzip = { path = "../remora-etcher-convert-adapter-gzip" }
remora-etcher-convert-adapter-qcow2 = { path = "../remora-etcher-convert-adapter-qcow2" }
remora-etcher-convert-application = { path = "../remora-etcher-convert-application" }
remora-etcher-identity-adapter-keygen = { path = "../remora-etcher-identity-adapter-keygen" }
remora-etcher-identity-application = { path = "../remora-etcher-identity-application" }
remora-etcher-config-application = { path = "../remora-etcher-config-application" }
remora-etcher-squashfs-application = { path = "../remora-etcher-squashfs-application" }
remora-etcher-squashfs-adapter-backhand = { path = "../remora-etcher-squashfs-adapter-backhand" }
remora-etcher-image-application = { path = "../remora-etcher-image-application" }
remora-etcher-image-adapter-partition-table = { path = "../remora-etcher-image-adapter-partition-table" }
remora-etcher-image-adapter-ext4 = { path = "../remora-etcher-image-adapter-ext4" }
remora-etcher-image-adapter-vfat = { path = "../remora-etcher-image-adapter-vfat" }
remora-etcher-fs-walk = { path = "../remora-etcher-fs-walk" }
remora-etcher-factory-application = { path = "../remora-etcher-factory-application" }
tokio = { workspace = true, features = ["macros", "rt"] }
