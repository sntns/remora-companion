[package]
name = "remora-station-application-transport-cli"
description = "clap subcommands for the station: `station serve` (station.yaml, the HTTP API and the labelling console) and `station simulate` (a device claiming its identity)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
remora-station = { path = "../station" }
remora-station-application-transport-http = { path = "../station-application-transport-http" }
remora-factory = { path = "../factory" }
remora-context = { path = "../context" }
remora-progress = { path = "../progress" }
remora-tui = { path = "../tui" }
clap.workspace = true
error-stack.workspace = true
thiserror.workspace = true
serde.workspace = true
yaml_serde.workspace = true
humantime.workspace = true
base64.workspace = true
tokio = { workspace = true, features = ["net"] }
tokio-util.workspace = true

[dev-dependencies]
tempfile.workspace = true
